[package]
name = "wasm-fuse"
version = "4.0.0"
edition = "2024"
description = "Merge multiple WebAssembly modules into one — a Rust counterpart to binaryen's wasm-merge"
license = "MIT OR Apache-2.0"
# Floor set by human-panic 2.0.6+ (via sysinfo); revisit if a library
# consumer ever needs an older toolchain.
rust-version = "1.88.0"
repository = "https://github.com/michaelficarra/wasm-fuse"
keywords = ["wasm", "webassembly", "merge", "bundler", "linker"]
categories = ["wasm", "command-line-utilities", "development-tools"]

[[bin]]
name = "wasm-fuse"
required-features = ["cli"]

# The integration tests drive the binary above; without its required feature
# the binary is never built, but Cargo would still set CARGO_BIN_EXE_wasm-fuse
# to the (non-existent) path. Requiring the feature here skips them instead.
[[test]]
name = "cli"
required-features = ["cli"]

[[test]]
name = "binaryen_suite"
required-features = ["cli"]

[[test]]
name = "source_map"
required-features = ["cli"]

[[test]]
name = "inline"
required-features = ["cli"]

[features]
default = ["cli"]
# Everything the binary needs beyond the library; library consumers can use
# `default-features = false` to avoid pulling in CLI dependencies.
cli = [
    "dep:anstream",
    "dep:anstyle",
    "dep:anyhow",
    "dep:clap",
    "dep:colorchoice-clap",
    "dep:human-panic",
    "dep:lazy_static",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:wild",
]

[dependencies]
# Stable feature-set surface (library side)
bitflags = "2.13.0"

# Bytecode Alliance plumbing (the wasm-tools family)
wasm-encoder = { version = "0.256", features = ["wasmparser"] }
wasmparser = "0.256"
wasmprinter = "0.256"
wat = "1.256"
# error battery pack (library side)
thiserror = "2.0.18"

# source-map JSON (library side)
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# cli battery pack (all optional, enabled by the `cli` feature)
anstream = { version = "1.0.0", optional = true }
anstyle = { version = "1.0.14", optional = true }
anyhow = { version = "1.0.102", optional = true }
clap = { version = "4.6.1", features = ["derive"], optional = true }
colorchoice-clap = { version = "1.0.8", optional = true }
human-panic = { version = "2.0.8", optional = true }
wild = { version = "2.2.1", optional = true }

# logging battery pack (CLI diagnostics)
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }

# Not used directly: transitive dependencies of tracing-subscriber that
# declare too-low minimums of their own dependencies; raised here so the
# minimal-versions CI job builds.
lazy_static = { version = "1.5.0", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1.0.150"
snapbox = { version = "1.2.2", features = ["cmd"] }
tempfile = "3.27.0"
wasmparser = "0.256"
wat = "1.256"

[[bench]]
name = "merge"
harness = false
